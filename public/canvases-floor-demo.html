<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Черновик: холсты на полу</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #050505;
      --fg: #f2f2f2;
      --muted: #8a8a8a;
      --font-display: "Cormorant Garamond", "Times New Roman", serif;
      --font-body: "Manrope", "Helvetica Neue", sans-serif;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
    }

    .page {
      position: relative;
      min-height: 100dvh;
      overflow: hidden;
      background:
        radial-gradient(ellipse 90% 55% at 50% 18%, #141414 0%, #070707 55%, #000 100%);
    }

    .back {
      position: absolute;
      top: 1.25rem;
      left: clamp(1rem, 3vw, 2rem);
      z-index: 5;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.85rem;
      letter-spacing: 0.04em;
    }

    .back:hover {
      color: var(--fg);
    }

    .title {
      position: absolute;
      top: 1.15rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      margin: 0;
      font-family: var(--font-display);
      font-weight: 400;
      font-size: clamp(1.2rem, 2.5vw, 1.6rem);
      letter-spacing: -0.02em;
      color: rgba(242, 242, 242, 0.7);
      pointer-events: none;
    }

    .stage {
      position: absolute;
      inset: 0;
      perspective: 900px;
      perspective-origin: 50% 58%;
    }

    .floor {
      position: absolute;
      left: -10%;
      right: -10%;
      bottom: 0;
      height: 42%;
      background:
        linear-gradient(180deg, transparent 0%, rgba(255, 255, 255, 0.015) 18%, rgba(0, 0, 0, 0.55) 100%),
        repeating-linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.012) 0,
          rgba(255, 255, 255, 0.012) 1px,
          transparent 1px,
          transparent 48px
        );
      transform-origin: center top;
      transform: rotateX(62deg);
      pointer-events: none;
    }

    .floor-glow {
      position: absolute;
      left: 10%;
      right: 10%;
      bottom: 8%;
      height: 28%;
      background: radial-gradient(ellipse 70% 55% at 50% 40%, rgba(255, 255, 255, 0.05) 0%, transparent 70%);
      pointer-events: none;
      filter: blur(8px);
    }

    .wall-shadow {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(0, 0, 0, 0.35) 0%, transparent 28%),
        radial-gradient(ellipse 80% 50% at 50% 100%, rgba(0, 0, 0, 0.55) 0%, transparent 60%);
      pointer-events: none;
      z-index: 2;
    }

    .canvases {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 10%;
      height: 72%;
      z-index: 1;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: clamp(0.35rem, 1.2vw, 1rem);
      padding: 0 clamp(0.5rem, 2vw, 2rem);
      transform-style: preserve-3d;
    }

    .canvas {
      position: relative;
      flex: 0 0 auto;
      width: var(--w, 8rem);
      aspect-ratio: 4 / 5;
      background: #1a1714 center 42% / cover no-repeat;
      box-shadow:
        0 18px 36px rgba(0, 0, 0, 0.55),
        0 2px 0 rgba(255, 255, 255, 0.05) inset,
        -1px 0 0 rgba(255, 255, 255, 0.04);
      transform:
        translateY(var(--y, 0))
        rotate(var(--r, 0deg))
        translateZ(var(--z, 0));
      transform-origin: 50% 100%;
      filter: saturate(1.02) contrast(1.04);
    }

    .canvas::after {
      content: "";
      position: absolute;
      left: 8%;
      right: 8%;
      bottom: -10%;
      height: 18%;
      background: radial-gradient(ellipse 55% 50% at 50% 0%, rgba(0, 0, 0, 0.45) 0%, transparent 70%);
      filter: blur(4px);
      z-index: -1;
      pointer-events: none;
    }

    .hint {
      position: absolute;
      bottom: 1.25rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      margin: 0;
      color: var(--muted);
      font-size: 0.8rem;
      letter-spacing: 0.04em;
    }

    @media (max-width: 720px) {
      .canvases {
        gap: 0.25rem;
        bottom: 12%;
        height: 68%;
      }

      .canvas {
        width: calc(var(--w, 8rem) * 0.62) !important;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <a class="back" href="index.html">← на сайт</a>
    <h1 class="title">Холсты на полу</h1>

    <div class="stage" aria-hidden="true">
      <div class="floor"></div>
      <div class="floor-glow"></div>
      <div class="canvases" id="canvases"></div>
      <div class="wall-shadow"></div>
    </div>

    <p class="hint">черновик фона · 18 картин как холсты</p>
  </div>

  <script>
    const layouts = [
      { n: 3,  w: "5.2rem",  r: "-8deg",  y: "1.2rem",  z: "-40px" },
      { n: 12, w: "6.4rem",  r: "5deg",   y: "0.4rem",  z: "-20px" },
      { n: 7,  w: "9.5rem",  r: "-3deg",  y: "0",       z: "10px" },
      { n: 15, w: "4.8rem",  r: "9deg",   y: "1.6rem",  z: "-50px" },
      { n: 1,  w: "11.5rem", r: "-1.5deg", y: "-0.2rem", z: "30px" },
      { n: 10, w: "7.2rem",  r: "4deg",   y: "0.8rem",  z: "-10px" },
      { n: 18, w: "13rem",   r: "1deg",   y: "0",       z: "40px" },
      { n: 5,  w: "8.4rem",  r: "-6deg",  y: "0.3rem",  z: "0" },
      { n: 14, w: "5.6rem",  r: "7deg",   y: "1.4rem",  z: "-30px" },
      { n: 2,  w: "10.2rem", r: "-2deg",  y: "0",       z: "20px" },
      { n: 9,  w: "6.8rem",  r: "3deg",   y: "0.9rem",  z: "-15px" },
      { n: 16, w: "4.4rem",  r: "-10deg", y: "1.8rem",  z: "-55px" },
      { n: 6,  w: "9rem",    r: "2.5deg", y: "0.2rem",  z: "5px" },
      { n: 11, w: "7.8rem",  r: "-4deg",  y: "0.6rem",  z: "-5px" },
      { n: 4,  w: "5rem",    r: "8deg",   y: "1.5rem",  z: "-45px" },
      { n: 17, w: "12rem",   r: "-1deg",  y: "-0.1rem", z: "35px" },
      { n: 8,  w: "6.2rem",  r: "5.5deg", y: "1rem",    z: "-25px" },
      { n: 13, w: "8.8rem",  r: "-3.5deg", y: "0.35rem", z: "8px" },
    ];

    const root = document.getElementById("canvases");
    root.innerHTML = layouts
      .map(
        (c) =>
          `<div class="canvas" style="--w:${c.w}; --r:${c.r}; --y:${c.y}; --z:${c.z}; background-image:url('images/tree-${c.n}.jpg')"></div>`
      )
      .join("");
  </script>
</body>
</html>
