    const list = document.getElementById("guide-list");
    const rail = document.getElementById("guide-rail");
    const dots = [];

    STYLES.forEach((style, i) => {
      const id = `style-${style.image}`;

      const dot = document.createElement("a");
      dot.className = "guide-rail-dot";
      dot.href = `#${id}`;
      dot.title = style.name;
      dot.setAttribute("aria-label", style.name);
      dot.innerHTML = `<img src="images/tree-${style.image}.jpg" alt="" loading="lazy" decoding="async" />`;
      rail.appendChild(dot);
      dots.push({ id, el: dot });

      const article = document.createElement("article");
      article.className = "guide-card";
      article.id = id;
      article.style.setProperty("--i", String(i));
      article.innerHTML = `
        <figure class="picture-frame picture-frame--${style.frame} picture-frame--compact guide-frame">
          <div class="picture-frame__moulding">
            <div class="picture-frame__lip">
              <div class="picture-frame__matte">
                <div class="picture-frame__glass">
                  <img src="images/tree-${style.image}.jpg" alt="${style.name}" loading="lazy" decoding="async" />
                </div>
              </div>
            </div>
          </div>
        </figure>
        <div class="guide-copy">
          <header class="guide-card-head">
            <h2 class="guide-card-title">${style.name}</h2>
            <span class="guide-card-year">${style.year}</span>
          </header>
          <p class="guide-card-text">${style.history}</p>
          <p class="guide-card-artists"><span>Представители:</span> ${style.artists}</p>
          ${
            style.sourceUrl
              ? `<p class="guide-card-source">Источник: <a href="${style.sourceUrl}" target="_blank" rel="noopener noreferrer">${style.source || "ссылка"}</a></p>`
              : ""
          }
        </div>
      `;
      list.appendChild(article);
    });

    const setActive = (id) => {
      dots.forEach(({ id: did, el }) => {
        el.classList.toggle("is-active", did === id);
      });
    };

    const observer = new IntersectionObserver(
      (entries) => {
        const visible = entries
          .filter((e) => e.isIntersecting)
          .sort((a, b) => b.intersectionRatio - a.intersectionRatio);
        if (visible[0]) setActive(visible[0].target.id);
      },
      { rootMargin: "-20% 0px -55% 0px", threshold: [0, 0.25, 0.5, 0.75, 1] }
    );

    STYLES.forEach((style) => {
      const card = document.getElementById(`style-${style.image}`);
      if (card) observer.observe(card);
    });

    if (location.hash) setActive(location.hash.slice(1));
    else if (dots[0]) setActive(dots[0].id);

  </script>
