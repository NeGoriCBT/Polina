      article.id = id;
      article.style.setProperty("--i", String(i));
      article.innerHTML = `
        <figure class="picture-frame picture-frame--${style.frame} picture-frame--compact guide-frame">
          <div class="picture-frame__moulding">
            <div class="picture-frame__lip">
              <div class="picture-frame__matte">

        </figure>
