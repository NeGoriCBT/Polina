<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Стили · Дерево в разных стилях</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=32" />
</head>
<body class="guide-page">
  <header class="guide-top">
    <a class="guide-back" href="index.html">← К опросу</a>
    <p class="guide-kicker">справочник</p>
    <h1 class="guide-title">Восемнадцать стилей</h1>
    <p class="guide-lead">
      Коротко о каждом направлении: когда оно появилось, чем отличалось
      и какое чувство часто оставляет дерево в этом языке.
    </p>
  </header>

  <nav class="guide-nav" id="guide-nav" aria-label="Стили"></nav>
  <main class="guide-list" id="guide-list"></main>

  <footer class="guide-foot">
    <a class="btn" href="index.html">Пройти опрос</a>
  </footer>

  <script>
    const STYLES = [
      {
        name: "Ренессанс",
        year: "~1400",
        image: 1,
        frame: "classic",
        history:
          "Зародился в Италии на рубеже XIV–XV веков и распространился по Европе. Художники заново открыли античность, перспективу, анатомию и интерес к реальному человеку и природе.",
        artists: "Леонардо да Винчи, Микеланджело, Рафаэль, Боттичелли, Дюрер",
      },
      {
        name: "Барокко",
        year: "~1600",
        image: 2,
        frame: "baroque",
        history:
          "Сложился в XVII веке, особенно сильно — в Италии, Испании, Фландрии. Эпоха контрастов: драматичный свет, движение, пышность, эмоциональный накал.",
        artists: "Караваджо, Бернини, Рубенс, Рембрандт, Веласкес",
      },
      {
        name: "Рококо",
        year: "~1730",
        image: 3,
        frame: "rococo",
        history:
          "Появился во Франции в XVIII веке как более лёгкий ответ барокко. Декоративность, изящество, светские сюжеты, пастельные оттенки и «воздушность».",
        artists: "Вато, Буше, Фрагонар, Тьеполо",
      },
      {
        name: "Классицизм",
        year: "~1750",
        image: 4,
        frame: "classicist",
        history:
          "Усилился во второй половине XVIII века. Ориентир — античная ясность, порядок, мера и рациональная композиция; часто связан с идеями Просвещения.",
        artists: "Пуссен, Давид, Энгр, Канова",
      },
      {
        name: "Романтизм",
        year: "~1820",
        image: 17,
        frame: "romantic",
        history:
          "Расцвет на рубеже XVIII–XIX веков. В центре — чувство, индивидуальность, природа как отражение души, интерес к истории, фантазии и сильным переживаниям.",
        artists: "Делакруа, Жерико, Фридрих, Тёрнер, Гойя",
      },
      {
        name: "Импрессионизм",
        year: "~1874",
        image: 5,
        frame: "impression",
        history:
          "Возник во Франции в 1860–1870-х. Художники писали на пленэре впечатление от света и воздуха, отказываясь от гладкой академической живописи.",
        artists: "Моне, Ренуар, Дега, Писсарро, Сислей",
      },
      {
        name: "Фовизм",
        year: "~1905",
        image: 6,
        frame: "darkwood",
        history:
          "Короткий, но яркий всплеск во Франции около 1905 года. Название «дикие» дали критики за чистый, резкий цвет и упрощённую форму.",
        artists: "Матисс, Дерен, Вламинк, Марке",
      },
      {
        name: "Экспрессионизм",
        year: "~1905",
        image: 7,
        frame: "darkwood",
        history:
          "Сильнее всего развился в Германии и Австрии в начале XX века. Мир искажали ради эмоции: тревоги, напряжения, внутреннего крика эпохи.",
        artists: "Кирхнер, Нольде, Мунк, Кандинский (ранний), Шиле",
      },
      {
        name: "Кубизм",
        year: "~1907",
        image: 8,
        frame: "black",
        history:
          "Появился во Франции около 1907–1908 годов. Предмет разбирали на грани и показывали сразу с нескольких точек зрения.",
        artists: "Пикассо, Брак, Грис, Леже",
      },
      {
        name: "Авангардизм",
        year: "~1910",
        image: 9,
        frame: "black",
        history:
          "Не один стиль, а волна экспериментов начала XX века: отказ от старых правил, поиск нового языка искусства накануне и во время больших исторических перемен.",
        artists: "Малевич, Татлин, Ларионов, Гончарова, Кандинский",
      },
      {
        name: "Абстракционизм",
        year: "~1910",
        image: 10,
        frame: "gallery",
        history:
          "С 1910-х годов художники уходят от узнаваемой натуры к цвету, линии и ритму. Важнее не сюжет, а сама живописная конструкция и её воздействие.",
        artists: "Кандинский, Мондриан, Малевич, Купка",
      },
      {
        name: "Супрематизм",
        year: "~1915",
        image: 11,
        frame: "suprematist",
        history:
          "Сформирован в России около 1915 года. «Чистая» живопись из простых геометрических фигур — квадрат, круг, крест — без бытового сюжета.",
        artists: "Малевич, Лисицкий, Розанова, Клюн",
      },
      {
        name: "Дадаизм",
        year: "~1916",
        image: 12,
        frame: "dada",
        history:
          "Родился во время Первой мировой войны (Цюрих, затем Берлин, Париж, Нью-Йорк). Ирония, случайность, коллаж и протест против «разумности» войны и культуры.",
        artists: "Дюшан, Арп, Тцара, Хаусман, Хёх",
      },
      {
        name: "Сюрреализм",
        year: "~1924",
        image: 13,
        frame: "surreal",
        history:
          "Оформился в 1920-х во Франции. Опирался на сновидения и бессознательное: странные встречи образов, как в сне наяву.",
        artists: "Дали, Магритт, Эрнст, Миро, Танги",
      },
      {
        name: "Активная живопись",
        year: "~1945",
        image: 14,
        frame: "action",
        history:
          "После 1945 года, прежде всего в США (action painting / абстрактный экспрессионизм). Важен жест, движение и след художника на холсте.",
        artists: "Поллок, де Кунинг, Клайн, Ротко",
      },
      {
        name: "Минимализм",
        year: "~1960",
        image: 15,
        frame: "minimal",
        history:
          "Сложился в 1960-х, особенно в США. Убирали всё лишнее: простые формы, повтор, ясность, отказ от повествовательности.",
        artists: "Джадд, Флавин, Андре, Мартин, Келли",
      },
      {
        name: "Поп-арт",
        year: "~1962",
        image: 16,
        frame: "pop",
        history:
          "Расцвет на рубеже 1950–1960-х в Великобритании и США. В искусство вошли реклама, комиксы, товары и звёзды массовой культуры.",
        artists: "Уорхол, Лихтенштейн, Гамильтон, Олденбург, Розенквист",
      },
      {
        name: "Постмодернизм",
        year: "~1980",
        image: 18,
        frame: "postmodern",
        history:
          "С конца XX века — сомнение в одном «главном» стиле. Цитаты, смесь эпох, ирония, игра с чужими языками и образами.",
        artists: "Баския, Шнабель, Кунс, Херст, Кабаков",
      },
    ];

    const nav = document.getElementById("guide-nav");
    const list = document.getElementById("guide-list");

    STYLES.forEach((style, i) => {
      const id = `style-${style.image}`;

      const chip = document.createElement("a");
      chip.className = "guide-chip";
      chip.href = `#${id}`;
      chip.textContent = style.name;
      nav.appendChild(chip);

      const article = document.createElement("article");
      article.className = "guide-card";
      article.id = id;
      article.style.setProperty("--i", String(i));
      article.innerHTML = `
        <figure class="picture-frame picture-frame--${style.frame} picture-frame--compact guide-frame">
          <div class="picture-frame__moulding">
            <div class="picture-frame__lip">
              <div class="picture-frame__matte">
                <div class="picture-frame__glass">
                  <img src="images/tree-${style.image}.jpg" alt="${style.name}" loading="lazy" decoding="async" />
                </div>
              </div>
            </div>
          </div>
        </figure>
        <div class="guide-copy">
          <header class="guide-card-head">
            <h2 class="guide-card-title">${style.name}</h2>
            <span class="guide-card-year">${style.year}</span>
          </header>
          <p class="guide-card-text">${style.history}</p>
          <p class="guide-card-artists"><span>Представители:</span> ${style.artists}</p>
        </div>
      `;
      list.appendChild(article);
    });
  </script>
</body>
</html>
